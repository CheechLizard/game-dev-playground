<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2130" viewBox="0 0 1400 2130" role="img" aria-labelledby="title desc">
  <title id="title">Modular Weapon System — module interactions and strike lifecycle</title>
  <desc id="desc">An application adapter supplies a frame bitstream to ordered triggers and direction to optional barrels. A striker starts when the trigger is hot and its independent sequence rail holds enough energy. Batteries refill that rail; the rail funds collider movement and optional ordered payloads. The striker emits individual Hit events and one final Complete with a hit count. A downstream Miss trigger accepts only zero-hit completion; a Complete trigger accepts every completion. The next sequence has its own batteries and receives no energy from the first. Insufficient startup energy skips a firing opportunity. Active exhaustion completes the strike, and a still-hot trigger can start a fresh strike when energy recovers. This is a functional flow chart, not a mandatory graph order.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#385c75"/></marker>
    <marker id="energy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b6513"/></marker>
    <marker id="event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#71529a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #203546; }
      .heading { font-size: 42px; font-weight: 650; }
      .sub { font-size: 23px; fill: #526573; }
      .section { font-size: 24px; font-weight: 650; letter-spacing: 1px; }
      .name { font-size: 28px; font-weight: 650; }
      .body { font-size: 23px; }
      .small { font-size: 21px; fill: #526573; }
      .label { font-size: 22px; font-weight: 550; }
      .box { fill: #fff; stroke: #b9c8d1; stroke-width: 2; }
      .power { fill: #fff7e7; stroke: #d7b372; stroke-width: 2; }
      .eventbox { fill: #f4effa; stroke: #bea9d3; stroke-width: 2; }
      .line { fill: none; stroke: #385c75; stroke-width: 3; marker-end: url(#flow); }
      .powerline { fill: none; stroke: #9b6513; stroke-width: 3; stroke-dasharray: 9 6; marker-end: url(#energy); }
      .eventline { fill: none; stroke: #71529a; stroke-width: 3; marker-end: url(#event); }
    </style>
  </defs>
  <rect width="1400" height="2130" fill="#f8fafb"/>
  <text x="50" y="65" class="heading">Modular Weapon System</text>
  <text x="50" y="104" class="sub">Module interactions · independent sequence power · Hit and Complete events</text>
  <path d="M 850 148 H 910" class="line"/><text x="926" y="155" class="small">Signal / direction</text>
  <path d="M 850 187 H 910" class="powerline"/><text x="926" y="194" class="small">Energy</text>
  <path d="M 850 226 H 910" class="eventline"/><text x="926" y="233" class="small">Strike events</text>

  <!-- The input layer normalizes devices and timing above the adapter. -->
  <rect x="50" y="154" width="300" height="100" rx="14" class="box"/>
  <text x="200" y="192" text-anchor="middle" class="name">Input layer</text>
  <text x="200" y="228" text-anchor="middle" class="small">Devices · timing · coalescing</text>
  <path d="M 350 205 H 469" class="line"/>
  <text x="410" y="183" text-anchor="middle" class="small">events</text>
  <rect x="470" y="154" width="330" height="100" rx="14" class="box"/>
  <text x="635" y="192" text-anchor="middle" class="name">Application adapter</text>
  <text x="635" y="228" text-anchor="middle" class="small">Normalized fire down / up</text>

  <rect x="40" y="289" width="1320" height="801" rx="22" fill="#edf3f7" stroke="#bdccd6" stroke-width="2"/>
  <text x="70" y="325" class="section">SEQUENCE A</text>
  <text x="1035" y="325" class="small">One shared power rail</text>

  <path d="M 635 254 V 349" class="line"/>
  <text x="653" y="282" class="label">frame bits</text>
  <path d="M 500 254 V 272 H 415 V 515 H 220 V 569" class="line"/>
  <text x="249" y="495" class="label">incoming DOI</text>

  <rect x="470" y="350" width="430" height="120" rx="14" class="box"/>
  <text x="685" y="392" text-anchor="middle" class="name">Trigger chain</text>
  <text x="685" y="430" text-anchor="middle" class="body">Process signals in graph order</text>
  <path d="M 685 470 V 569" class="line"/>
  <text x="705" y="525" class="label">hot output</text>

  <rect x="70" y="570" width="305" height="190" rx="14" class="box"/>
  <text x="222" y="614" text-anchor="middle" class="name">Barrels</text>
  <text x="222" y="650" text-anchor="middle" class="body">Transform DOI</text>
  <text x="222" y="682" text-anchor="middle" class="body">Route / combine inputs</text>
  <text x="222" y="726" text-anchor="middle" class="small">Optional; absent = random</text>
  <path d="M 375 663 H 469" class="line"/>

  <rect x="470" y="570" width="430" height="190" rx="14" fill="#dcebf3" stroke="#7d9eb4" stroke-width="2"/>
  <text x="685" y="614" text-anchor="middle" class="name">Striker</text>
  <text x="685" y="653" text-anchor="middle" class="body">Hot + enough stored energy → start</text>
  <text x="685" y="688" text-anchor="middle" class="body">Position and move collider</text>
  <text x="685" y="728" text-anchor="middle" class="small">One input · multiple outputs</text>

  <rect x="1035" y="350" width="300" height="120" rx="14" class="power"/>
  <text x="1185" y="392" text-anchor="middle" class="name">Batteries</text>
  <text x="1185" y="430" text-anchor="middle" class="body">Add capacity + fill rate</text>
  <path d="M 1185 470 V 569" class="powerline"/>
  <text x="1205" y="525" class="label">refill</text>
  <rect x="1035" y="570" width="300" height="190" rx="14" class="power"/>
  <text x="1185" y="614" text-anchor="middle" class="name">Sequence rail</text>
  <text x="1185" y="653" text-anchor="middle" class="body">Stored energy E ≤ C</text>
  <text x="1185" y="688" text-anchor="middle" class="body">Fill rate R</text>
  <text x="1185" y="728" text-anchor="middle" class="small">Battery placement is irrelevant</text>
  <path d="M 1035 663 H 901" class="powerline"/>
  <text x="968" y="642" text-anchor="middle" class="small">fund</text>

  <path d="M 685 760 V 849" class="line"/>
  <text x="706" y="808" class="label">activate in order</text>
  <rect x="470" y="850" width="430" height="140" rx="14" class="box"/>
  <text x="685" y="893" text-anchor="middle" class="name">Payloads</text>
  <text x="685" y="931" text-anchor="middle" class="body">Shape · damage · visual effects</text>
  <text x="685" y="969" text-anchor="middle" class="small">Optional; absent = no damage</text>
  <path d="M 1185 760 V 920 H 901" class="powerline"/>
  <text x="1210" y="825" class="small">fund</text>
  <text x="1210" y="853" class="small">effects</text>

  <!-- Event path originates at the striker, bypassing the optional payload. -->
  <path d="M 470 712 H 414 V 1046 H 685 V 1179" class="eventline"/>
  <text x="70" y="855" class="small">Striker events do not</text>
  <text x="70" y="883" class="small">require a Payload.</text>
  <text x="70" y="952" class="small">Functional relationships,</text>
  <text x="70" y="980" class="small">not mandatory graph order.</text>
  <text x="706" y="1128" class="label" fill="#71529a">Outcome + position + DOI + normal when available</text>
  <text x="706" y="1158" class="small">Sequence boundary: NO ENERGY TRANSFER</text>

  <rect x="40" y="1180" width="1320" height="487" rx="22" fill="#f3f0f7" stroke="#c9bbd7" stroke-width="2"/>
  <text x="70" y="1221" class="section">STRIKER OUTPUT → NEXT SEQUENCE'S TRIGGER</text>
  <rect x="90" y="1255" width="355" height="114" rx="14" class="eventbox"/>
  <text x="267" y="1295" text-anchor="middle" class="name">Hit</text>
  <text x="267" y="1335" text-anchor="middle" class="body">Each qualifying contact</text>
  <rect x="530" y="1255" width="760" height="114" rx="14" class="eventbox"/>
  <text x="910" y="1295" text-anchor="middle" class="name">Complete</text>
  <text x="910" y="1335" text-anchor="middle" class="body">Once at end · final hitCount · completion reason</text>
  <path d="M 685 1180 V 1239 H 267 V 1254" class="eventline"/>
  <path d="M 685 1239 H 910 V 1254" class="eventline"/>

  <path d="M 267 1369 V 1424" class="eventline"/>
  <path d="M 730 1369 V 1424" class="eventline"/>
  <path d="M 1110 1369 V 1424" class="eventline"/>
  <rect x="90" y="1425" width="355" height="110" rx="14" class="box"/>
  <text x="267" y="1465" text-anchor="middle" class="name">Hit Trigger</text>
  <text x="267" y="1503" text-anchor="middle" class="small">Convert qualifying hits to signals</text>
  <rect x="530" y="1425" width="355" height="110" rx="14" class="box"/>
  <text x="707" y="1465" text-anchor="middle" class="name">Miss Trigger</text>
  <text x="707" y="1503" text-anchor="middle" class="body">Only if hitCount = 0</text>
  <rect x="935" y="1425" width="355" height="110" rx="14" class="box"/>
  <text x="1112" y="1465" text-anchor="middle" class="name">Complete Trigger</text>
  <text x="1112" y="1503" text-anchor="middle" class="body">Every completion</text>

  <path d="M 267 1535 V 1575" class="line"/>
  <path d="M 707 1535 V 1575" class="line"/>
  <path d="M 1112 1535 V 1575" class="line"/>
  <text x="700" y="1611" text-anchor="middle" class="body">Each connected downstream sequence runs the same module interactions</text>
  <text x="700" y="1642" text-anchor="middle" class="small">Its own Batteries + rail + Striker · optional Barrels and Payloads · no borrowed energy</text>

  <text x="50" y="1730" class="section">ENERGY EXHAUSTION &amp; RESTART</text>
  <rect x="50" y="1760" width="400" height="193" rx="14" class="box"/>
  <text x="75" y="1803" class="name">Before startup</text>
  <text x="75" y="1843" class="body">Not enough stored energy?</text>
  <text x="75" y="1878" class="body">Skip this opportunity.</text>
  <text x="75" y="1920" class="small">No strike → no completion event</text>
  <rect x="500" y="1760" width="400" height="193" rx="14" class="box"/>
  <text x="525" y="1803" class="name">During a strike</text>
  <text x="525" y="1843" class="body">Cannot fund continuing work?</text>
  <text x="525" y="1878" class="body">End → Complete(hitCount).</text>
  <text x="525" y="1920" class="small">Miss activates only at zero hits</text>
  <rect x="950" y="1760" width="400" height="193" rx="14" class="power"/>
  <text x="975" y="1803" class="name">After refill</text>
  <text x="975" y="1843" class="body">Still hot + startup cost available?</text>
  <text x="975" y="1878" class="body">Start a NEW strike.</text>
  <text x="975" y="1920" class="small">Fresh lifetime and hit count</text>
  <path d="M 450 1987 H 1150 V 1954" class="line"/>
  <path d="M 250 1953 V 1987 H 449" fill="none" stroke="#385c75" stroke-width="3"/>
  <path d="M 700 1953 V 1987" fill="none" stroke="#385c75" stroke-width="3"/>
  <text x="700" y="2027" text-anchor="middle" class="small">Reservoir replenishes under battery subclass rules; a cold trigger does not fire.</text>
  <text x="50" y="2093" class="small">Design v2.0 · 20 September 2026 · Current runtime still implements the earlier model</text>
</svg>
